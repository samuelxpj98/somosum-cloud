
<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>SomosUm Goiás</title>
    
    <!-- Conexão com o Manifesto para transformar em App -->
    <link rel="manifest" href="metadata.json">

    <!-- Meta tags para comportamento de Aplicativo Nativo (iOS) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SomosUm">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1E293B">

    <!-- Ícones de alta fidelidade para Tela de Início -->
    <link rel="apple-touch-icon" href="https://img.icons8.com/fluency/180/bible.png">
    <link rel="apple-touch-icon" sizes="152x152" href="https://img.icons8.com/fluency/152/bible.png">
    <link rel="apple-touch-icon" sizes="180x180" href="https://img.icons8.com/fluency/180/bible.png">
    <link rel="apple-touch-icon" sizes="167x167" href="https://img.icons8.com/fluency/167/bible.png">

    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Lora:ital,wght@1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    
    <style>
      :root {
        --primary-navy: #1E293B;
        --accent-blue: #3B82F6;
        --text-body: #334155;
        --bg-app: #F1F5F9;
      }

      .material-symbols-outlined {
        font-family: 'Material Symbols Outlined' !important;
        font-weight: normal;
        font-style: normal;
        font-size: 24px;
        line-height: 1;
        letter-spacing: normal;
        text-transform: none;
        display: inline-block;
        white-space: nowrap;
        word-wrap: normal;
        direction: ltr;
        -webkit-font-feature-settings: 'liga';
        -webkit-font-smoothing: antialiased;
      }

      body {
        font-family: 'Inter', sans-serif;
        background-color: var(--bg-app);
        color: var(--text-body);
        overflow-x: hidden;
        line-height: 1.6;
        touch-action: manipulation; /* Melhora resposta ao toque */
        -webkit-text-size-adjust: 100%;
        -webkit-tap-highlight-color: transparent;
      }

      /* Estilo para ocupar a área do Notch do iPhone */
      @supports (padding: env(safe-area-inset-top)) {
        header {
          padding-top: calc(1.25rem + env(safe-area-inset-top)) !important;
        }
        nav {
          padding-bottom: calc(0.5rem + env(safe-area-inset-bottom)) !important;
          height: auto !important;
          min-height: 5rem;
        }
      }

      .font-display { font-family: 'Inter', sans-serif; font-weight: 700; }
      .font-serif { font-family: 'Lora', serif; font-style: italic; }
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      .soft-shadow { box-shadow: 0 4px 20px -2px rgba(30, 41, 59, 0.05); }

      .prose h1, .prose h2, .prose h3, .prose h4, .prose strong {
        color: inherit;
        font-weight: 800;
        letter-spacing: -0.025em;
      }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@^19.2.3",
        "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
        "react/": "https://esm.sh/react@^19.2.3/",
        "react-router-dom": "https://esm.sh/react-router-dom@^7.11.0",
        "vite": "https://esm.sh/vite@^7.3.0",
        "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2",
        "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
        "marked": "https://esm.sh/marked@^17.0.1",
        "firebase/": "https://esm.sh/firebase@^12.7.0/"
      }
    }
    </script>
    <script>
      // Evita o scroll elástico e zoom indesejado
      document.addEventListener('gesturestart', function(e) {
        e.preventDefault();
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
